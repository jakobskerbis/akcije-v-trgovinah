name: Android in Windows aplikacija

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: flutter_app } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: flutter_app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - name: APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../AkcijeSI.apk
      - name: Demo APK za posnetke zaslona
        run: flutter build apk --debug --dart-define=DEMO=true
      - uses: actions/upload-artifact@v4
        with: { name: AkcijeSI-android, path: AkcijeSI.apk }
      - name: Objava v Releases (android-latest)
        working-directory: .
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android – zadnja različica" \
              --notes "Namesti AkcijeSI.apk na telefon (dovoli namestitev iz neznanih virov). Navodila v README."
          gh release upload android-latest AkcijeSI.apk --clobber
      - name: Omogoči KVM za emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Posnetki zaslona (Android emulator)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          working-directory: flutter_app
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            mkdir -p ../screenshots
            adb shell am start -n com.jakobskerbis.akcijesi/com.jakobskerbis.akcije_si.MainActivity
            sleep 25
            adb exec-out screencap -p > ../screenshots/android-1-izpostavljeno.png
            adb shell input tap 324 2250
            sleep 4
            adb exec-out screencap -p > ../screenshots/android-2-kategorije.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: posnetki-android, path: screenshots, if-no-files-found: ignore }
      - name: Posnetki v vejo screenshots-android
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: .
        run: |
          [ -d screenshots ] && [ -n "$(ls -A screenshots)" ] || exit 0
          cd screenshots
          git init -q -b screenshots-android
          git config user.name "akcije-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Posnetki"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-android:screenshots-android

  windows:
    needs: test
    runs-on: windows-latest
    defaults: { run: { working-directory: flutter_app } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - name: Windows build
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../AkcijeSI-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: AkcijeSI-windows, path: AkcijeSI-windows.zip }
      - name: Objava v Releases (windows-latest)
        working-directory: .
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view windows-latest >/dev/null 2>&1 || \
            gh release create windows-latest --prerelease --title "Windows – zadnja različica" \
              --notes "Razpakiraj AkcijeSI-windows.zip in zaženi akcije_si.exe. Navodila v README."
          gh release upload windows-latest AkcijeSI-windows.zip --clobber
      - name: Posnetek zaslona (Windows, demo podatki)
        continue-on-error: true
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=DEMO=true
          $p = Start-Process -FilePath "build/windows/x64/runner/Release/akcije_si.exe" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path ../screenshots | Out-Null
          $bmp.Save("$PWD/../screenshots/windows-1-izpostavljeno.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: posnetki-windows, path: screenshots, if-no-files-found: ignore }
      - name: Posnetki v vejo screenshots-windows
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: .
        run: |
          [ -d screenshots ] && [ -n "$(ls -A screenshots)" ] || exit 0
          cd screenshots
          git init -q -b screenshots-windows
          git config user.name "akcije-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Posnetki"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-windows:screenshots-windows
