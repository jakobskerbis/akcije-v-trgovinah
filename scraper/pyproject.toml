[project]
name = "akcije-si"
version = "1.0.0"
description = "Zajem akcij slovenskih trgovcev za osebno rabo"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["akcije*"]
